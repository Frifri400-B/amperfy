name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag (ex: v1.2.3) ou Commit SHA (ex: 7abfc7c)'
        required: true
        default: '7abfc7c'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Recuperer le code depuis le depot officiel
        uses: actions/checkout@v4
        with:
          repository: 'BLeeEZ/amperfy'
          fetch-depth: 0

      - name: Basculer sur le commit ou tag choisi
        run: git checkout ${{ github.event.inputs.version_tag }}

      - name: Force Xcode 16 / Selection du toolchain
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          else
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          fi

      - name: Compile et cree le fichier IPA propre
        run: |
          xcodebuild clean build \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            BUILD_DIR=build

          mkdir -p Payload
          mv build/Release-iphoneos/Amperfy.app Payload/
          zip -r Amperfy.ipa Payload

      - name: Telecharge le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-${{ github.event.inputs.version_tag }}-Unsigned-IPA
          path: Amperfy.ipa
