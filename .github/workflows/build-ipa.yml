name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag (ex: v1.2.3) ou Commit SHA (ex: 7abfc7c)'
        required: true
        default: '7abfc7c'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Recuperer le code depuis le depot officiel
        uses: actions/checkout@v4
        with:
          repository: 'BLeeEZ/amperfy'
          fetch-depth: 0

      - name: Basculer sur le commit ou tag choisi
        run: git checkout ${{ github.event.inputs.version_tag }}

      - name: Force Xcode 16
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> $GITHUB_ENV

      - name: Compiler et archiver l'application
        run: |
          xcodebuild archive \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Amperfy.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO

          mkdir -p Payload
          cp -r build/Amperfy.xcarchive/Products/Applications/Amperfy.app Payload/
          zip -r Amperfy.ipa Payload

      - name: Telecharge le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-${{ github.event.inputs.version_tag }}-Unsigned-IPA
          path: Amperfy.ipa
