name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag (ex: v1.2.3) ou Commit SHA (ex: 7abfc7c)'
        required: true
        default: '7abfc7c'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Recuperer le code depuis le depot officiel
        uses: actions/checkout@v4
        with:
          repository: 'BLeeEZ/amperfy'
          fetch-depth: 0

      - name: Basculer sur le commit ou tag choisi
        run: git checkout ${{ github.event.inputs.version_tag }}

      - name: Selectionner Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile et cree le fichier IPA
        run: |
          xcodebuild build \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

          mkdir -p Payload
          mv build/Release-iphoneos/Amperfy.app Payload/
          zip -r Amperfy.ipa Payload

      - name: Telecharge le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-${{ github.event.inputs.version_tag }}-Unsigned-IPA
          path: Amperfy.ipa
