name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag (ex: v1.2.3) ou Commit SHA (ex: 7abfc7c)'
        required: true
        default: 'v1.2.3'

jobs:
  build:
    runs-on: macos-14


    steps:
      - name: Recuperer le code de la version choisie
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }}

      - name: Prepare Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile et cree le fichier IPA
        run: |
          xcodebuild build \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

          mkdir -p Payload
          mv build/Release-iphoneos/Amperfy.app Payload/
          zip -r Amperfy.ipa Payload

      - name: Telecharge le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-${{ github.event.inputs.version_tag }}-Unsigned-IPA
          path: Amperfy.ipa

